# Nombre de la aplicacion
spring.application.name=LoreCodex

# Load local .env when present (Docker/local dev)
spring.config.import=optional:env[.env]

# IGDB INTEGRATION (no secrets committed)
igdb.client-id=${IGDB_CLIENT_ID:${CLIENT_ID:}}
igdb.client-secret=${IGDB_CLIENT_SECRET:${CLIENT_SECRET:}}
igdb.token-url=${IGDB_TOKEN_URL:${TOKEN_URL:https://id.twitch.tv/oauth2/token}}

# Puerto del servidor
server.port=${APP_PORT:8081}

# Configuración de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:lorecodex_db}
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=true

# Local JWT token signing key (only used when SECURITY_AUTH_PROVIDER=local)
token.signing.key=${TOKEN_SIGNING_KEY:${SIGNIN_TOKEN:${JWT_SECRET:}}}

# Auth0 Resource Server (used when SECURITY_AUTH_PROVIDER=auth0)
security.auth.provider=${SECURITY_AUTH_PROVIDER:local}
auth0.domain=${AUTH0_DOMAIN:}
auth0.audience=${AUTH0_AUDIENCE:}
auth0.issuer-uri=${AUTH0_ISSUER_URI:}
auth0.jwks-uri=${AUTH0_JWKS_URI:}
auth0.principal-claim=${AUTH0_PRINCIPAL_CLAIM:sub}
auth0.roles-claim=${AUTH0_ROLES_CLAIM:roles}
auth0.permissions-claim=${AUTH0_PERMISSIONS_CLAIM:permissions}
auth0.email-claim=${AUTH0_EMAIL_CLAIM:email}
auth0.auto-provision-user=${AUTH0_AUTO_PROVISION_USER:true}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Límite máximo permitido para un solo archivo
spring.servlet.multipart.max-file-size=10MB

# Límite máximo permitido para toda la request (suma de archivos)
spring.servlet.multipart.max-request-size=10MB

# Configuración SMTP para Mailtrap
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
