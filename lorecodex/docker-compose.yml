services:
  db:
    image: postgres:15
    container_name: lorecodexdb
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-lorecodex_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  lorecodex:
    build: .
    container_name: lorecodex_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dentro del compose, el DB host es el nombre del servicio
      DB_HOST: db
      DB_PORT: 5432
      # Alinea el puerto interno con el mapeo 8081:8081
      APP_PORT: 8081
    ports:
      - "8081:8081"

volumes:
  pgdata:
